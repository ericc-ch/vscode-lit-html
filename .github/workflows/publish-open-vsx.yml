on:
  push:
    tags:
      - 'v*'
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install ovsx
        run: bun install -g ovsx

      - name: Publish to Open VSX
        run: ovsx publish --pat ${{ secrets.OPEN_VSX_TOKEN }}
