on:
  push:
    tags:
      - 'v*'
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install ovsx
        run: npm install -g ovsx

      - name: Publish to Open VSX
        run: ovsx publish --pat ${{ secrets.OPEN_VSX_TOKEN }}
